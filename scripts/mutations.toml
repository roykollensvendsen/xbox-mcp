# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/xbox_mcp/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a commit message never links to a Claude session"
file = "scripts/no_session_links.py"
find = 'if SESSION\.search\(message\):'
replace = 'if False:'

[[rule]]
name = "a home-network address is never committed"
file = "scripts/private_data_scan.py"
find = 'found \+= \[f"home-network address \{m\}" for m in PRIVATE_IPV4\.findall\(text\)\]'
replace = 'pass'

[[rule]]
name = "an email address is never committed"
file = "scripts/private_data_scan.py"
find = 'found \+= \[f"email address \{m\}" for m in emails\]'
replace = 'pass'

[[rule]]
name = "a value from the settings file is never committed"
file = "scripts/private_data_scan.py"
find = 'found \+= \[f"a value from \{SETTINGS\.name\}" for s in secrets if s in text\]'
replace = 'pass'

[[rule]]
name = "a measure that gets worse fails the check"
file = "scripts/ratchet.py"
find = 'if _worse\(metric, base\[metric\], now\[metric\]\) and metric not in allowed:'
replace = 'if False:'

[[rule]]
name = "when the levels main kept are missing, the base is measured"
file = "scripts/ratchet.py"
find = '^    return measure_base\(\)$'
replace = 'return {}'

[[rule]]
name = "an import a layer may not use is a breach"
file = "scripts/ratchet.py"
find = 'if layer\(inside\) not in ALLOWED\[mine\]:'
replace = 'if False:'

[[rule]]
name = "a module with no layer is a breach"
file = "scripts/ratchet.py"
find = 'if layer\(module\) == "unassigned":'
replace = 'if False:'

[[rule]]
name = "a cloud that does not answer is not called on or off"
file = "src/xbox_mcp/service.py"
find = 'return answer\("unreachable", UNREACHABLE, power=None, running=None\)'
replace = 'return answer("done", UNREACHABLE, power="off", running=None)'

[[rule]]
name = "an unknown power state is not called on or off"
file = "src/xbox_mcp/service.py"
find = 'if status\.power == "unknown":'
replace = 'if False:'

[[rule]]
name = "a tool still working at the deadline says it carries on"
file = "src/xbox_mcp/server.py"
find = 'answer = await asyncio\.wait_for\(asyncio\.shield\(work\), ANSWER_WITHIN\)'
replace = 'answer = await work'

[[rule]]
name = "every tool answers with a sentence, even when it fails"
file = "src/xbox_mcp/server.py"
find = 'answer = \{"success": False, "outcome": "refused", "say": BROKE\}'
replace = 'raise'

[[rule]]
name = "every simulated answer says simulated first"
file = "src/xbox_mcp/server.py"
find = 'if self\._simulated:'
replace = 'if False:'

[[rule]]
name = "only the tv status and input tools are ever called"
file = "src/xbox_mcp/tv.py"
find = 'if tool not in self\.TOOLS:'
replace = 'if False:'

[[rule]]
name = "a tv that is not on is never sent an input"
file = "src/xbox_mcp/tv.py"
find = 'return _alone\(NOT_ON\)'
replace = 'break'

[[rule]]
name = "a token older than thirty seconds is refused"
file = "src/xbox_mcp/power.py"
find = 'if self\._clock\(\) - question\.asked_at > CONFIRM_WITHIN:'
replace = 'if False:'

[[rule]]
name = "a token is single-use"
file = "src/xbox_mcp/power.py"
find = '^        if self\._open == question:$'
replace = 'if False:'

[[rule]]
name = "between 22 and 07 a wake is refused unless the tv is on"
file = "src/xbox_mcp/service.py"
find = '^        if on is True:$'
replace = 'if True:'

[[rule]]
name = "a token is spent only once the command was sent"
file = "src/xbox_mcp/service.py"
find = 'return cloud_failure\(error, power=None\)$'
replace = 'return self.questions.spend(question) or cloud_failure(error, power=None)'

[[rule]]
name = "a command is said as done only once the status reads it back"
file = "src/xbox_mcp/service.py"
find = 'if power != wanted:$'
replace = 'if False:'

[[rule]]
name = "only a title on the owners list is ever started"
file = "src/xbox_mcp/service.py"
find = 'if len\(names\) != 1:'
replace = 'if False:'

[[rule]]
name = "a launch is refused unless the xbox is on"
file = "src/xbox_mcp/service.py"
find = 'if status\.power != "on":'
replace = 'if False:'

[[rule]]
name = "only an installed title is ever started"
file = "src/xbox_mcp/service.py"
find = '^        if not installed:$'
replace = 'if False:'

[[rule]]
name = "a start is said as done only once the xbox shows it"
file = "src/xbox_mcp/service.py"
find = 'if shows != app\.aumid:'
replace = 'if False:'

[[rule]]
name = "only an allow-listed library call is ever made"
file = "src/xbox_mcp/drivers/cloud.py"
find = 'if path not in ALLOWED:'
replace = 'if False:'

[[rule]]
name = "a token file others can read is refused"
file = "src/xbox_mcp/drivers/cloud.py"
find = 'if path\.stat\(\)\.st_mode & \(stat\.S_IRWXG \| stat\.S_IRWXO\):'
replace = 'if False:'

[[rule]]
name = "a sign-in code is redeemed only with its pkce verifier"
file = "src/xbox_mcp/drivers/cloud.py"
find = '"code_verifier": self\.verifier,'
replace = ''
